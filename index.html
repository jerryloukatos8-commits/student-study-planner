
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySpace | Student Study Planner</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #20243a;
    }

    header {
      background: #fff;
      padding: 22px 6%;
      border-bottom: 1px solid #e5e8f0;
    }

    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 6px 0 0; color: #697087; }

    main {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .card, .panel {
      background: white;
      border: 1px solid #e5e8f0;
      border-radius: 14px;
      padding: 18px;
    }

    .summary strong {
      display: block;
      font-size: 27px;
      margin-top: 7px;
    }

    .muted { color: #737b91; font-size: 13px; }

    .panel { margin-bottom: 18px; }

    h2 { margin: 0 0 15px; font-size: 19px; }

    form {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      font: inherit;
    }

    input, select {
      border: 1px solid #d9deea;
      background: white;
      color: #20243a;
    }

    .full { grid-column: 1 / -1; }

    button {
      border: 0;
      background: #5356d8;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { opacity: .9; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filters button {
      background: #eef0ff;
      color: #4144b7;
      width: auto;
      padding: 8px 13px;
    }

    .filters button.active {
      background: #5356d8;
      color: white;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid #edf0f5;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .task-info { flex: 1; min-width: 0; }
    .task-title { font-weight: 600; overflow-wrap: anywhere; }
    .task.done .task-title {
      text-decoration: line-through;
      color: #858b9d;
    }

    .task-meta {
      margin-top: 5px;
      font-size: 12px;
      color: #737b91;
    }

    .priority {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 6px;
      background: #fff0d8;
      color: #925b00;
      font-size: 11px;
      margin-top: 6px;
    }

    .delete {
      width: auto;
      background: #fff0f0;
      color: #b42323;
      padding: 7px 9px;
      font-size: 12px;
    }

    .empty {
      padding: 24px 0;
      text-align: center;
      color: #737b91;
      font-size: 14px;
    }

    .progress-track {
      height: 8px;
      background: #e9ebf4;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      height: 100%;
      background: #5356d8;
      width: 0;
      transition: width .2s;
    }

    footer {
      text-align: center;
      color: #858b9d;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 560px) {
      header { padding: 20px; }
      main { margin-top: 18px; }
      .summary { gap: 8px; }
      .card { padding: 12px; }
      .summary strong { font-size: 23px; }
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .task { gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 StudySpace</h1>
    <p>Your schoolwork, organized in one place.</p>
  </header>

  <main>
    <section class="summary">
      <div class="card">
        <span class="muted">Total tasks</span>
        <strong id="total">0</strong>
      </div>
      <div class="card">
        <span class="muted">Remaining</span>
        <strong id="remaining">0</strong>
      </div>
      <div class="card">
        <span class="muted">Completed</span>
        <strong id="completed">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>➕ Add an assignment</h2>
      <form id="task-form">
        <div>
          <label for="task-title">Assignment name</label>
          <input id="task-title" maxlength="120"
            placeholder="e.g. Chemistry worksheet" required>
        </div>

        <div>
          <label for="subject">Subject</label>
          <select id="subject">
            <option>Math</option>
            <option>Science</option>
            <option>English</option>
            <option>History</option>
            <option>Foreign language</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label for="due-date">Due date</label>
          <input id="due-date" type="date" required>
        </div>

        <div>
          <label for="priority">Priority</label>
          <select id="priority">
            <option>Normal</option>
            <option>High</option>
            <option>Low</option>
          </select>
        </div>

        <div class="full">
          <button type="submit">Add assignment</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>📋 My assignments</h2>
      <div class="filters">
        <button type="button" class="active" data-filter="all">All</button>
        <button type="button" data-filter="active">Remaining</button>
        <button type="button" data-filter="done">Completed</button>
      </div>
      <div id="task-list"></div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="muted" id="progress-label">Your progress will appear here.</p>
    </section>
  </main>

  <footer>StudySpace · A simpler way to stay on top of school.</footer>

  <script>
    const STORAGE_KEY = "studyspace-tasks-v1";
    let tasks = [];
    let currentFilter = "all";

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      tasks = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    const form = document.getElementById("task-form");
    const list = document.getElementById("task-list");

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch {
        alert("Your browser could not save changes on this device.");
      }
    }

    function updateSummary() {
      const done = tasks.filter(task => task.done).length;
      document.getElementById("total").textContent = tasks.length;
      document.getElementById("remaining").textContent =
        tasks.length - done;
      document.getElementById("completed").textContent = done;

      const percent = tasks.length ? Math.round(done / tasks.length * 100) : 0;
      document.getElementById("progress-fill").style.width = percent + "%";
      document.getElementById("progress-label").textContent =
        tasks.length ? percent + "% of assignments completed" :
        "Add an assignment to get started.";
    }

    function renderTasks() {
      list.replaceChildren();

      const filtered = tasks
        .filter(task => currentFilter === "all" ||
          (currentFilter === "active" && !task.done) ||
          (currentFilter === "done" && task.done))
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tasks.length ?
          "No assignments in this view." :
          "No assignments yet. Add your first one above!";
        list.appendChild(empty);
      }

      filtered.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark assignment complete");
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const info = document.createElement("div");
        info.className = "task-info";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;

        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent = task.subject + " · Due " + task.dueDate;

        info.append(title, meta);

        if (task.priority === "High") {
          const badge = document.createElement("span");
          badge.className = "priority";
          badge.textContent = "High priority";
          info.appendChild(badge);
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        row.append(checkbox, info, remove);
        list.appendChild(row);
      });

      updateSummary();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = document.getElementById("task-title").value.trim();
      const dueDate = document.getElementById("due-date").value;

      if (!title || !dueDate) return;

      tasks.push({
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        title,
        subject: document.getElementById("subject").value,
        dueDate,
        priority: document.getElementById("priority").value,
        done: false
      });

      saveTasks();
      form.reset();
      renderTasks();
    });

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
